        <!--===============================================================================================-->
        <link

    </head>
    <body>
      <div class="limiter">
        <div class="container-login100" style="background-color: blue; padding-bottom: 100px;">
          <div class="wrap-login100">
            <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()" class="login100-form validate-form">
              <span class="login100-form-title p-b-34 p-t-14">Add Employee</span>
      
              <!-- Name Input -->
              <div class="wrap-input100 validate-input">
                <input class="input100" type="text" formControlName="Firstname" placeholder="First Name" />
                <span class="focus-input100" data-placeholder="&#xf207;"></span>
              </div>
      
              <div class="wrap-input100 validate-input">
                <input class="input100" type="text" formControlName="Lastname" placeholder="Last Name" />
                <span class="focus-input100" data-placeholder="&#xf207;"></span>
              </div>

              <div class="wrap-input100 validate-input">
                <input class="input100" type="text" formControlName="HomeAddress" placeholder="Address" />
                <span class="focus-input100" data-placeholder="&#xf2bc;"></span>
              </div>
      
              <!-- Company Dropdown -->
              <div class="wrap-input100 validate-input"  *ngIf="companies && companies.length > 0">
                <mat-form-field appearance="fill" class="full-width">
                  <mat-label>Select Company</mat-label>
                  <mat-select formControlName="CompanyName" (selectionChange)="onCompanyChange($event)">
                    <mat-option *ngFor="let company of companies" [value]="company._id">{{ company.CompanyName }}</mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
      
              <!-- Other Fields -->
              <div class="wrap-input100 validate-input">
                <input class="input100" type="email" formControlName="Email" placeholder="Email" />
                <span class="focus-input100" data-placeholder="&#xf34a;"></span>
              </div>

              <div class="wrap-input100 validate-input">
                <mat-form-field appearance="fill">
                  <mat-label>Vehicle Make</mat-label>
                  <mat-select formControlName="VehicleMake" (selectionChange)="onMakeChange($event)">
                    <mat-option *ngFor="let make of vehicleMakes" [value]="make">
                      {{ make }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>

              <div class="wrap-input100 validate-input">
                <mat-form-field appearance="fill">
                  <mat-label>Vehicle Model</mat-label>
                  <mat-select formControlName="VehicleModel" (selectionChange)="onModelChange($event)" [disabled]="!selectedVehicleMake">
                    <mat-option *ngFor="let model of filteredModels" [value]="model.Model">
                      {{ model.Model }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
      
              <div class="wrap-input100 validate-input">
                <input class="input100" type="text" formControlName="Password" placeholder="Password" />
                <span class="focus-input100" data-placeholder="&#xf2b9;"></span>
              </div>
              <div class="wrap-input100 validate-input">
                <mat-form-field appearance="fill" class="full-width">
                  <mat-label>Role</mat-label>
                  <mat-select formControlName="Role">
                    <mat-option value="user">User</mat-option>
                    <mat-option value="companyadmin">Company Admin</mat-option>
                  </mat-select>
                </mat-form-field>
              </div>

      
              <!-- Submit Button -->
              <div class="container-login100-form-btn">
                <button class="login100-form-btn" type="submit">Add Employee</button>
              </div>
            </form>
          </div>
        </div>
      </div>
      <!--<p>{{ companies | json }}</p>-->

        <!--===============================================================================================-->

        <!--===============================================================================================-->

        <!--===============================================================================================-->
        <script src="../../main.js"></script>
    </body>
</html>
