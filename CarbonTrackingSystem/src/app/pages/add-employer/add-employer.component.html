        />
        <!--===============================================================================================-->
        <link
            rel="stylesheet"
            type="text/css"
            href="../../fonts/font-awesome-4.7.0/css/font-awesome.min.css"
        />
        <!--===============================================================================================-->
        <link
            rel="stylesheet"
            type="text/css"
            href="../../fonts/iconic/css/material-design-iconic-font.min.css"
        />
        <!--===============================================================================================-->
        <link
            rel="stylesheet"
            type="text/css"
            href="../../vendor/animate/animate.css"
        />
        <!--===============================================================================================-->
        <link
            rel="stylesheet"
            type="text/css"
            href="../../vendor/css-hamburgers/hamburgers.min.css"
        />
        <!--===============================================================================================-->
        <link
            rel="stylesheet"
            type="text/css"

        <!--===============================================================================================-->
    </head>
    <body>
        <div class="limiter">
            <div class="container-login100" style="background-color: blue; padding-bottom: 100px;">
              <div class="wrap-login100">
                <form [formGroup]="employerForm" (ngSubmit)="onSubmit()" class="login100-form validate-form">
                  <span class="login100-form-title p-b-34 p-t-14">
                    Add Employer
                  </span>
          
                  <div class="wrap-input100 validate-input">
                    <input class="input100" type="text" formControlName="CompanyName" placeholder="Company Name" />
                    <span class="focus-input100" data-placeholder="&#xf207;"></span>
                  </div>
          
                  <div class="wrap-input100 validate-input">
                    <input class="input100" type="text" formControlName="CompanyAddress" placeholder="Address" />
                    <span class="focus-input100" data-placeholder="&#xf2bc;"></span>
                  </div>
          
                  <div class="wrap-input100 validate-input">
                    <input class="input100" type="text" formControlName="CompanyEmail" placeholder="Email" />
                    <span class="focus-input100" data-placeholder="&#xf34a;"></span>
                  </div>
          
                  <div class="wrap-input100 validate-input">
                    <input class="input100" type="text" formControlName="PhoneNumber" placeholder="Phone Number" />
                    <span class="focus-input100" data-placeholder="&#xf2b9;"></span>
                  </div>
          
                  <div class="container-login100-form-btn">
                    <button class="login100-form-btn" type="submit">
                      Add Employer
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>

        <!--===============================================================================================-->
        <script src="../../vendor/jquery/jquery-3.2.1.min.js"></script>
        <!--===============================================================================================-->
        <script src="../../vendor/animsition/js/animsition.min.js"></script>
        <!--===============================================================================================-->
        <script src="../../vendor/bootstrap/js/popper.js"></script>
        <script src="../../vendor/bootstrap/js/bootstrap.min.js"></script>
        <!--===============================================================================================-->
        <script src="../../vendor/select2/select2.min.js"></script>
        <!--===============================================================================================-->
        <script src="../../vendor/daterangepicker/moment.min.js"></script>
        <script src="../../vendor/daterangepicker/daterangepicker.js"></script>
        <!--===============================================================================================-->
        <script src="../../vendor/countdowntime/countdowntime.js"></script>
        <!--===============================================================================================-->
        <script src="../../main.js"></script>
    </body>
</html>
