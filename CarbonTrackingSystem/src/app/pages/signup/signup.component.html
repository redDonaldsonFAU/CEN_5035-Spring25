<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Liscensed CC BY 3.0 -->
        <title>Signup</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!--=========== Will clean up code later ==========================================================-->
        <link
            rel="icon"
            type="image/png"
            href="../../images/icons/favicon.ico"
        />
        <!--===============================================================================================-->
        <link
            rel="stylesheet"
            type="text/css"
            href="../../vendor/bootstrap/css/bootstrap.min.css"
        />
        <!--===============================================================================================-->
        <link
            rel="stylesheet"
            type="text/css"
            href="../../fonts/font-awesome-4.7.0/css/font-awesome.min.css"
        />
        <!--===============================================================================================-->
        <link
            rel="stylesheet"
            type="text/css"
            href="../../fonts/iconic/css/material-design-iconic-font.min.css"
        />
        <!--===============================================================================================-->
        <link rel="stylesheet" type="text/css" href="../../util.css" />
        <link rel="stylesheet" type="text/css" href="../../app.component.css" />
        <link rel="stylesheet" type="text/css" href="signup.component.css">
        <!--===============================================================================================-->
    </head>
    <body>
        <div class="limiter">
            <div
                class="container-login100"
                style="background-color: blue; padding-bottom: 100px;"
            >
                <div class="wrap-login100">
                    <form class="login100-form validate-form">
                        <span class="login100-form-title p-b-34 p-t-14">
                            Sign Up
                        </span>

                        <div
                            class="wrap-input100 validate-input"
                            data-validate="First Name"
                        >
                            <input
                                class="input100"
                                type="text"
                                name="firstname"
                                placeholder="First Name"
                            />
                            <span
                                class="focus-input100"
                                data-placeholder="&#xf207;"
                            ></span>
                        </div>

                        <div
                            class="wrap-input100 validate-input"
                            data-validate="Last Name"
                        >
                            <input
                                class="input100"
                                type="text"
                                name="lastname"
                                placeholder="Last Name"
                            />
                            <span
                                class="focus-input100"
                                data-placeholder="&#xf207;"
                            ></span>
                        </div>

                        <div
                            class="wrap-input100 validate-input"
                            data-validate="Enter username"
                        >
                            <input
                                class="input100"
                                type="text"
                                name="username"
                                placeholder="Username"
                            />
                            <span
                                class="focus-input100"
                                data-placeholder="&#xf207;"
                            ></span>
                        </div>

                        <div
                            class="wrap-input100 validate-input"
                            data-validate="Enter Email"
                        >
                            <input
                                class="input100"
                                type="text"
                                name="email"
                                placeholder="Email"
                            />
                            <span
                                class="focus-input100"
                                data-placeholder="&#xf34a;"
                            ></span>
                        </div>

                        <div
                            class="wrap-input100 validate-input"
                            data-validate="Enter Address"
                        >
                            <input
                                class="input100"
                                type="text"
                                name="address"
                                placeholder="Address"
                            />
                            <span
                                class="focus-input100"
                                data-placeholder="&#xf2bc;"
                            ></span>
                        </div>

                        <div
                            class="wrap-input100 validate-input"
                            data-validate="Phone Number"
                        >
                            <input
                                class="input100"
                                type="text"
                                name="phonenumber"
                                placeholder="Phone Number"
                            />
                            <span
                                class="focus-input100"
                                data-placeholder="&#xf2b9;"
                            ></span>
                        </div>

                        <div
                            class="wrap-input100 validate-input"
                            data-validate="Enter password"
                        >
                            <input
                                class="input100"
                                type="password"
                                name="pass"
                                placeholder="Password"
                            />
                            <span
                                class="focus-input100"
                                data-placeholder="&#xf191;"
                            ></span>
                        </div>

                        <div class = "wrap-input100 validate-input" data-validate="Select Employer">

                            <select employer="employer" id="employer">
                                <option value="Select an employer">Select your employer</option>
                                <option value="Company 1">Company 1</option>
                                <option value="Company 2">Company 2</option>
                                <option value="Company 3">Company 3</option>
                                <option value="Company 4">Company 4</option>
                            </select>
 
                        </div>

                        <br />

                        <div class="container-login100-form-btn">
                            <!-- if form is filled out -->
                            <button class="login100-form-btn" >Signup</button>
                            <!-- onclick='location.href="../settings/settings.component.html"'-->

                        </div>

                        <div class="text-center p-t-30">
                            <a class="txt1" [routerLink]="['/login']">Have an account already? Login Here</a>
                        </div>
                    </form>
                    <br>
                </div>
            </div>
        </div>

        <div id="dropDownSelect1"></div>

        <!--===============================================================================================-->
        <script src="../../vendor/jquery/jquery-3.2.1.min.js"></script>
        <!--===============================================================================================-->
        <script src="../../vendor/animsition/js/animsition.min.js"></script>
        <!--===============================================================================================-->
        <script src="../../vendor/bootstrap/js/popper.js"></script>
        <script src="../../vendor/bootstrap/js/bootstrap.min.js"></script>
        <!--===============================================================================================-->
        <script src="../../vendor/select2/select2.min.js"></script>
        <!--===============================================================================================-->
        <script src="../../vendor/daterangepicker/moment.min.js"></script>
        <script src="../../vendor/daterangepicker/daterangepicker.js"></script>
        <!--===============================================================================================-->
        <script src="../../vendor/countdowntime/countdowntime.js"></script>
        <!--===============================================================================================-->
        <script src="../../main.js"></script>
    </body>
</html>
